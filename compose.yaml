services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/promptedit
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: '1'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            VITE_PORT: '${VITE_PORT:-5173}'
        volumes:
            - ./:/var/www/html
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
    worker:
        image: sail-8.3/promptedit
        command: php artisan queue:work --sleep=1 --tries=3 --timeout=60
        working_dir: /var/www/html
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: '1'
        volumes:
            - ./:/var/www/html
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            laravel.test:
                condition: service_started
        restart: unless-stopped
    scheduler:
        image: sail-8.3/promptedit
        command: php artisan schedule:work
        working_dir: /var/www/html
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: '1'
        volumes:
            - ./:/var/www/html
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            laravel.test:
                condition: service_started
        restart: unless-stopped
    pgsql:
        image: postgres:17-alpine
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-promptedit}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - sail-pgsql:/var/lib/postgresql/data
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "${DB_USERNAME:-sail}" -d "${DB_DATABASE:-promptedit}"']
            interval: 5s
            timeout: 5s
            retries: 15
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
