name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promptedit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promptedit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Validate local Docker Compose configuration
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Run CI Checks
        run: composer ci:check

      - name: Run tests against PostgreSQL
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_URL: ''
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: promptedit_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare local Docker settings
        run: cp .env.docker.example .env

      - name: Build project-owned PHP and Node image
        run: docker compose build app

      - name: Verify required runtimes inside image
        run: |
          docker compose run --rm --no-deps app php -m | grep -E 'pdo_pgsql|pdo_sqlite|mbstring'
          docker compose run --rm --no-deps app composer --version
          docker compose run --rm --no-deps app node --version
          docker compose run --rm --no-deps app npm --version
